name: CI

on:
  push:
    branches: [master, develop, feature/**]
  pull_request:
    branches: [master]

env:
  GO_VERSION: "1.22"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install revive
        run: go install github.com/mgechev/revive@latest
      - name: Lint
        run: revive -config revive.toml ./...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: facturae_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d facturae_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils openssl sqlite3 jq curl
      - name: Download modules
        run: go mod download
      - name: Run all tests (memory + sqlite + postgres)
        run: go test ./... -count=1 -v 2>&1 | tee /tmp/test-output.log
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: facturae_test
      - name: Check for failures
        run: |
          if grep -q "^--- FAIL" /tmp/test-output.log; then
            echo "Test failures detected!"
            grep "^--- FAIL" /tmp/test-output.log
            exit 1
          fi
          echo "All tests passed."

  test-scripts:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils jq curl
      - name: Build binary
        run: go build -o /tmp/facturae-engine ./src/cmd/facturae-engine
      - name: test-invoice.sh
        run: bash scripts/test-invoice.sh src/testdata/invoice_simple.json 127.0.0.1:9090 /tmp/facturae-engine
      - name: test-chain.sh
        run: bash scripts/test-chain.sh src/testdata/invoice_simple.json src/testdata/invoice_multi_iva.json 127.0.0.1:9091 /tmp/facturae-engine
      - name: test-chain-verify.sh
        run: bash scripts/test-chain-verify.sh src/testdata/invoice_simple.json src/testdata/invoice_multi_iva.json 127.0.0.1:9093 /tmp/facturae-engine

  docker-compose:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose -f docker-compose.test.yml build
      - name: Run full test stack (postgres + go test + scripts)
        run: docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from test
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
