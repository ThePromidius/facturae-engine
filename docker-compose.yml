version: '3.8'

services:
  # -----------------------------------------------------
  # 1. EL "MÚSCULO" (Nuestra Caja Negra en Go)
  # -----------------------------------------------------
  facturae-engine:
    build: 
      context: .
      dockerfile: Dockerfile
    image: facturae-engine:latest
    container_name: facturae-engine
    restart: unless-stopped
    # Configuración de base de datos para persistencia de la cadena Verifactu
    command: 
      - "./facturae-engine"
      - "-aeat=false"
      - "-db=postgres"
      - "-dsn=postgres://facturacion:supersecretpassword@postgres-db:5432/verifactu_db?sslmode=disable"
      - "-schemas=/app/schemas"
    # Solo está conectado a la red backend. Inaccesible desde el exterior.
    networks:
      - backend_net
    volumes:
      # Montamos la carpeta de schemas para cachear el XSD de Hacienda
      - ./data/schemas:/app/schemas
      # Montamos los certificados p12 (solo lectura)
      - ./data/certs:/app/certs:ro
    # No exponemos puertos 'ports:' al host. Solo FastAPI podrá hablar con él en http://facturae-engine:8080

  # -----------------------------------------------------
  # 2. LA "MEMORIA RÁPIDA" (Redis para la cola de tareas)
  # -----------------------------------------------------
  redis-queue:
    image: redis:7-alpine
    container_name: redis-queue
    restart: unless-stopped
    networks:
      - backend_net
    # Activamos AOF (Append Only File) para que no se pierdan facturas si hay un apagón
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # -----------------------------------------------------
  # 3. LA "CAJA FUERTE" (PostgreSQL para persistencia)
  # -----------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    networks:
      - backend_net
    environment:
      POSTGRES_USER: facturacion
      POSTGRES_PASSWORD: supersecretpassword # Cambiar en producción
      POSTGRES_DB: verifactu_db
    volumes:
      # En tu R730, este volumen mapeará directamente a un dataset de ZFS
      - pg_data:/var/lib/postgresql/data

  # -----------------------------------------------------
  # 4. EL "CEREBRO" Y GATEWAY (FastAPI)
  # -----------------------------------------------------
  # (Comentado hasta que escribamos el código Python)
  # api-gateway:
  #   image: python:3.12-slim
  #   container_name: api-gateway
  #   restart: unless-stopped
  #   networks:
  #     - frontend_net  # Habla con el exterior (ej. Traefik)
  #     - backend_net   # Habla con Go, Redis y Postgres
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - redis-queue
  #     - postgres-db
  #     - facturae-engine

networks:
  backend_net:
    driver: bridge
    internal: true # Seguridad extrema: Esta red no tiene salida a internet por defecto para evitar fugas.
  # frontend_net:
  #   driver: bridge

volumes:
  redis_data:
  pg_data:
